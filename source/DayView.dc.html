<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عرض اليوم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.btn{transition:filter .15s ease}
.btn:hover{filter:brightness(.96)}
.btn:focus-visible,.ev:focus-visible{outline:2px solid #2563EB;outline-offset:1px}
.ev:hover{filter:brightness(.97)}
.free:hover{background:#F7F9FF !important;border-color:#2563EB !important;color:#1A44B8 !important}
</style>
</helmet>
<div dir="rtl" style="display:flex;width:1672px;height:1000px;background:#FFFFFF">
<div style="flex:0 0 232px;display:flex"><dc-import name="Sidebar" active="appts" hint-size="232px,1000px"></dc-import></div>
<div dir="rtl" style="width:1440px;height:1000px;box-sizing:border-box;padding:24px 28px;background:#FFFFFF;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1A1A1A;display:flex;flex-direction:column;gap:14px">

  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
    <h1 style="margin:0;font-size:20px;font-weight:600">الجمعة 30 أكتوبر 2026</h1>
    <div style="display:flex;gap:4px">
      <button class="btn" type="button" aria-label="اليوم السابق" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="btn" type="button" aria-label="اليوم التالي" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <button class="btn" type="button" style="display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer">اليوم</button>
    <span style="font-size:13px;color:#616161">11 موعداً · 3 أوقات متاحة</span>
    <div style="margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
      <div role="group" aria-label="طريقة العرض" style="display:flex;gap:2px;background:#F4F4F5;border-radius:8px;padding:2px">
        <button type="button" aria-pressed="true" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:#FFFFFF;color:#1A1A1A;font-family:inherit;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer">يوم</button>
        <button type="button" aria-pressed="false" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#4A4A4A;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer">أسبوع</button>
        <a href="Calendar.dc.html" style="display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:6px;color:#4A4A4A;font-size:12px;font-weight:500;text-decoration:none">شهر</a>
      </div>
      <button class="btn" type="button" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #2563EB;border-radius:8px;background:#2563EB;color:#FFFFFF;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>موعد جديد</button>
    </div>
  </div>

  <div style="border:1px solid #EBEBEB;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1">
    <!-- column headers -->
    <div style="display:flex;border-bottom:1px solid #EBEBEB;background:#FAFAFA">
      <div style="width:64px;flex:none"></div>
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
        <div style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-inline-start:1px solid #EBEBEB">
          <span style="width:30px;height:30px;border-radius:50%;background:#EDEDEE;color:#3F3F3F;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">{{c.ini}}</span>
          <span style="display:flex;flex-direction:column">
            <span style="font-size:13px;font-weight:600">{{c.name}}</span>
            <span style="font-size:11px;color:#616161">{{c.sub}}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <!-- grid -->
    <div style="display:flex;position:relative">
      <div style="width:64px;flex:none;position:relative;height:720px">
        <sc-for list="{{hours}}" as="h" hint-placeholder-count="9">
          <span style="{{h.style}}">{{h.t}}</span>
        </sc-for>
      </div>
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
        <div style="flex:1;position:relative;height:720px;border-inline-start:1px solid #EBEBEB;background-image:repeating-linear-gradient(to bottom,#EBEBEB 0 1px,transparent 1px 80px),repeating-linear-gradient(to bottom,transparent 0 40px,#F5F5F5 40px 41px,transparent 41px 80px)">
          <div aria-hidden="true" style="position:absolute;top:400px;height:80px;inset-inline:0;background:repeating-linear-gradient(45deg,#F4F4F5 0 6px,#FAFAFA 6px 12px);display:flex;align-items:center;justify-content:center;font-size:11px;color:#616161">استراحة</div>
          <sc-if value="{{c.off}}" hint-placeholder-val="{{false}}">
            <div style="position:absolute;inset:0;background:#FAFAFA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#616161">
              <span style="width:36px;height:36px;border-radius:10px;background:#EDEDEE;color:#3F3F3F;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 15l6 0"/></svg></span>
              <span style="font-size:13px;font-weight:500;color:#3F3F3F">في إجازة حتى الأحد</span>
            </div>
          </sc-if>
          <sc-for list="{{c.events}}" as="e" hint-placeholder-count="4">
            <button class="ev" type="button" aria-label="{{e.aria}}" style="{{e.style}}">
              <span style="display:flex;align-items:center;gap:6px;width:100%">
                <span style="font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.9">{{e.range}}</span>
                <span style="{{e.dot}}"></span>
              </span>
              <span style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:start">{{e.n}}</span>
              <sc-if value="{{e.tall}}" hint-placeholder-val="{{true}}">
                <span style="font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:start">{{e.p}}</span>
              </sc-if>
            </button>
          </sc-for>
          <sc-for list="{{c.free}}" as="f" hint-placeholder-count="1">
            <button class="free" type="button" style="{{f.style}}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>{{f.label}}</button>
          </sc-for>
        </div>
      </sc-for>
      <!-- now line -->
      <div aria-label="الوقت الحالي 14:17" role="img" style="position:absolute;top:503px;inset-inline-start:56px;inset-inline-end:0;height:0;border-top:1.5px solid #DC2626">
        <span style="position:absolute;top:-5px;inset-inline-start:-5px;width:9px;height:9px;border-radius:50%;background:#DC2626"></span>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1672,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var PX = 80, START = 8;
    var M = {
      confirmed: { bg: '#DCF5E6', fg: '#0B5A29', b: '#B5E3C6', d: '#15803D', l: 'مؤكد' },
      pending: { bg: '#FDEBC0', fg: '#5E3A00', b: '#F2D58C', d: '#D98E04', l: 'بانتظار التأكيد' },
      arrived: { bg: '#DCE7FE', fg: '#173A9E', b: '#B9CEF8', d: '#2563EB', l: 'في العيادة' },
      done: { bg: '#F1F1F2', fg: '#3F3F3F', b: '#E3E3E3', d: '#8A8A8A', l: 'منتهٍ' },
      cancelled: { bg: '#FFFFFF', fg: '#A31616', b: '#F1B9B9', d: '#DC2626', l: 'ملغى' }
    };
    function hm(t) { var a = t.split(':'); return +a[0] + (+a[1]) / 60; }
    function fmt(h) { var H = Math.floor(h), m = Math.round((h - H) * 60); return (H < 10 ? '0' : '') + H + ':' + (m < 10 ? '0' : '') + m; }
    function ev(t, dur, n, p, s) {
      var st = hm(t), en = st + dur / 60, m = M[s], top = (st - START) * PX, h = dur / 60 * PX - 4;
      return { n: n, p: p, range: t + ' – ' + fmt(en), tall: h >= 56, aria: t + '، ' + n + '، ' + p + '، ' + m.l,
        dot: 'margin-inline-start:auto;width:7px;height:7px;border-radius:50%;flex:none;background:' + m.d,
        style: 'position:absolute;top:' + (top + 2) + 'px;height:' + h + 'px;inset-inline:4px;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 8px;border-radius:8px;overflow:hidden;font-family:inherit;cursor:pointer;text-align:start;background:' + m.bg + ';color:' + m.fg + ';border:1px solid ' + m.b + (s === 'cancelled' ? ';text-decoration:line-through;border-style:dashed' : '') };
    }
    function free(t, dur) {
      var top = (hm(t) - START) * PX;
      return { label: 'متاح ' + t, style: 'position:absolute;top:' + (top + 2) + 'px;height:' + (dur / 60 * PX - 4) + 'px;inset-inline:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:5px;border:1px dashed #CFCFCF;border-radius:8px;background:transparent;color:#616161;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer' };
    }
    var cols = [
      { name: 'د. أحمد', ini: 'أح', sub: '6 مواعيد · العيادة 1', off: false,
        events: [ev('09:00', 60, 'فاطمة محمد', 'تنظيف وتلميع', 'done'), ev('10:00', 45, 'سيدي عبد الله', 'حشوة تجميلية', 'done'), ev('11:15', 45, 'خديجة سالم', 'علاج عصب', 'cancelled'), ev('12:00', 60, 'يحيى أحمد', 'فحص وأشعة', 'done'), ev('14:00', 90, 'إبراهيم سالم', 'تحضير تاج زيركون', 'arrived'), ev('16:00', 45, 'حواء محمد', 'حشوة', 'pending')],
        free: [free('15:30', 30)] },
      { name: 'د. سارة', ini: 'سا', sub: '5 مواعيد · العيادة 2', off: false,
        events: [ev('08:30', 30, 'ليلى أحمد', 'فحص سريع', 'done'), ev('10:30', 45, 'مريم أحمد', 'خلع ضرس', 'done'), ev('11:15', 45, 'محمد الأمين', 'متابعة تقويم', 'done'), ev('14:30', 45, 'زينب محمد', 'تبييض', 'confirmed'), ev('15:30', 60, 'عبد الرحمن محمود', 'فحص أولي', 'pending')],
        free: [free('12:00', 60), free('09:00', 60)] },
      { name: 'د. يوسف', ini: 'يو', sub: 'غير متاح اليوم', off: true, events: [], free: [] }
    ];
    var hours = [];
    for (var h = 8; h <= 16; h++) hours.push({ t: (h < 10 ? '0' : '') + h + ':00', style: 'position:absolute;top:' + ((h - START) * PX - 7) + 'px;inset-inline-end:10px;font-size:11px;color:#616161;font-variant-numeric:tabular-nums' + (h === 8 ? ';top:4px' : '') });
    return { cols: cols, hours: hours };
  }
}
</script>
</body>
</html>
