<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.in:focus-within{border-color:#A3A3A3 !important}
.btn{transition:filter .15s ease}
.btn:hover{filter:brightness(.95)}
.btn:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
a{color:#2563EB;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div dir="rtl" style="font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1A1A1A;background:#FFFFFF;min-height:100vh;display:flex;flex-wrap:wrap">

  <main style="flex:1 1 480px;display:flex;flex-direction:column;padding:32px 40px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:8px;background:#1A1A1A;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></div>
      <span style="font-size:15px;font-weight:600">[اسم النظام]</span>
      <button type="button" style="margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;font-family:inherit;font-size:12px;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>Français</button>
    </div>

    <form style="margin:auto;width:100%;max-width:360px;display:flex;flex-direction:column;gap:18px;padding:40px 0">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h1 style="margin:0;font-size:24px;font-weight:600">تسجيل الدخول</h1>
        <p style="margin:0;font-size:13px;color:#616161">أدخل بيانات حسابك في العيادة</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="lg1" style="font-size:13px;font-weight:500">رقم الهاتف أو البريد</label>
        <div class="in" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid #E3E3E3;border-radius:8px;color:#616161">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
          <input id="lg1" type="text" autocomplete="username" placeholder="22 00 00 00" style="flex:1;min-width:0;border:0;outline:none;font-family:inherit;font-size:14px;color:#1A1A1A;background:transparent">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center"><label for="lg2" style="font-size:13px;font-weight:500">كلمة المرور</label><a href="#" style="margin-inline-start:auto;font-size:12px;font-weight:500">نسيت كلمة المرور؟</a></div>
        <div class="in" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;padding-inline-start:12px;padding-inline-end:6px;border:1px solid #E3E3E3;border-radius:8px;color:#616161">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="lg2" type="password" autocomplete="current-password" placeholder="••••••••" style="flex:1;min-width:0;border:0;outline:none;font-family:inherit;font-size:14px;color:#1A1A1A;background:transparent">
          <button type="button" aria-label="إظهار كلمة المرور" style="width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#4A4A4A;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" checked="{{true}}" style="width:15px;height:15px;margin:0;accent-color:#2563EB">تذكرني على هذا الجهاز</label>

      <a class="btn" href="Main.dc.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;box-sizing:border-box;border:1px solid #2563EB;border-radius:8px;background:#2563EB;color:#FFFFFF;font-size:14px;font-weight:600;text-decoration:none">
        دخول<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>

      <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:#616161"><span style="flex:1;height:1px;background:#EBEBEB"></span>أو<span style="flex:1;height:1px;background:#EBEBEB"></span></div>

      <button class="btn" type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>الدخول برمز عبر واتساب</button>

      <p style="margin:0;font-size:12px;color:#616161;text-align:center">ليس لديك حساب؟ اطلب من مدير العيادة إضافتك</p>
    </form>

    <div style="display:flex;gap:16px;font-size:12px;color:#616161">
      <span>© 2026</span><a href="#" style="color:#616161">الخصوصية</a><a href="#" style="color:#616161">الدعم</a>
    </div>
  </main>

  <aside aria-hidden="true" style="flex:1 1 480px;background:#F7F7F8;border-right:1px solid #EBEBEB;display:flex;align-items:center;justify-content:center;padding:48px;box-sizing:border-box">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:28px;font-weight:700;line-height:1.35">عيادتك كلها<br>في شاشة واحدة</span>
        <span style="font-size:14px;color:#4A4A4A;line-height:1.7">المواعيد، ملفات المرضى، الفواتير ورسائل واتساب في مكان واحد.</span>
      </div>
      <div style="position:relative;height:220px">
        <div style="position:absolute;top:0;inset-inline-start:0;width:78%;background:#FFFFFF;border:1px solid #EBEBEB;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.05)">
          <div style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#DCE7FE;color:#1A44B8;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span style="font-size:13px;font-weight:600">مواعيد اليوم</span></div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="color:#616161;width:36px">09:00</span><span style="flex:1;height:22px;border-radius:6px;background:#DCF5E6"></span></div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="color:#616161;width:36px">10:30</span><span style="flex:1;height:22px;border-radius:6px;background:#FDEBC0"></span></div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="color:#616161;width:36px">11:15</span><span style="width:60%;height:22px;border-radius:6px;background:#DCE7FE"></span></div>
        </div>
        <div style="position:absolute;bottom:0;inset-inline-end:0;width:56%;background:#FFFFFF;border:1px solid #EBEBEB;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.08)">
          <span style="width:32px;height:32px;border-radius:9px;background:#DCF5E6;color:#0F6B32;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:600">أُرسل التذكير</span><span style="font-size:12px;color:#616161">عبر واتساب</span></span>
        </div>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
