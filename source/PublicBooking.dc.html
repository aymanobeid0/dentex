<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صفحة الحجز العامة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button:focus-visible,input:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.in:focus-within{border-color:#A3A3A3 !important}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1A1A1A;display:flex;flex-direction:column">
  <div style="flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:center;gap:12px">
      <span style="width:48px;height:48px;border-radius:12px;background:#1A1A1A;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></span>
      <div style="display:flex;flex-direction:column"><h1 style="margin:0;font-size:18px;font-weight:700">عيادة النور لطب الأسنان</h1><span style="font-size:13px;color:#616161">نواكشوط · مفتوح اليوم حتى 17:00</span></div>
    </header>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font-size:15px;font-weight:600">ما الخدمة التي تحتاجها؟</h2>
      <div role="radiogroup" aria-label="الخدمة" style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{services}}" as="s" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">
            <span style="display:flex;flex-direction:column;flex:1;text-align:start"><span style="font-size:14px;font-weight:600">{{s.n}}</span><span style="font-size:12px;color:#616161">{{s.d}}</span></span>
            <span style="{{s.radio}}"></span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font-size:15px;font-weight:600">اليوم</h2>
      <div role="radiogroup" aria-label="اليوم" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{d.on}}" disabled="{{d.off}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size:11px">{{d.w}}</span><span style="font-size:18px;font-weight:700;line-height:1.1">{{d.n}}</span></button>
        </sc-for>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font-size:15px;font-weight:600">الوقت</h2>
      <div role="radiogroup" aria-label="الوقت" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
        <sc-for list="{{slots}}" as="t" hint-placeholder-count="8">
          <button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.t}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;font-size:15px;font-weight:600">بياناتك</h2>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">الاسم<span class="in" style="display:flex;height:48px;border:1px solid #E3E3E3;border-radius:12px;overflow:hidden"><input type="text" placeholder="الاسم الكامل" style="flex:1;min-width:0;border:0;padding:0 14px;font-family:inherit;font-size:15px;outline:none"></span></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">رقم واتساب<span class="in" dir="ltr" style="display:flex;height:48px;border:1px solid #E3E3E3;border-radius:12px;overflow:hidden"><span style="display:flex;align-items:center;padding:0 12px;background:#F7F7F8;border-right:1px solid #E3E3E3;font-size:15px;color:#3F3F3F">+222</span><input type="tel" placeholder="22 00 00 00" style="flex:1;min-width:0;border:0;padding:0 12px;font-family:inherit;font-size:15px;outline:none"></span></label>
    </section>
  </div>

  <div style="padding:12px 18px 20px;border-top:1px solid #EBEBEB;display:flex;flex-direction:column;gap:8px;background:#FFFFFF">
    <span style="font-size:13px;color:#4A4A4A;text-align:center">{{summary}}</span>
    <button type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;border:0;border-radius:14px;background:#2563EB;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>تأكيد الحجز عبر واتساب</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, s = this.state || {};
    var sv = s.sv === undefined ? 0 : s.sv, dy = s.dy === undefined ? 1 : s.dy, sl = s.sl || '10:30';
    var SV = [{ n: 'فحص واستشارة', d: '20 دقيقة · [السعر]' }, { n: 'تنظيف وتلميع', d: '45 دقيقة · [السعر]' }, { n: 'ألم أو حالة عاجلة', d: 'أقرب موعد متاح' }, { n: 'تجميل وتبييض', d: 'استشارة أولى' }];
    var services = SV.map(function (x, i) {
      var on = i === sv;
      return Object.assign({}, x, { on: on, pick: function () { self.setState({ sv: i }); },
        style: 'display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border-radius:12px;font-family:inherit;color:#1A1A1A;cursor:pointer;' + (on ? 'background:#F7F9FF;border:1.5px solid #2563EB' : 'background:#FFFFFF;border:1px solid #E3E3E3'),
        radio: 'width:20px;height:20px;border-radius:50%;box-sizing:border-box;flex:none;' + (on ? 'border:6px solid #2563EB' : 'border:1.5px solid #BDBDBD') });
    });
    var DY = [{ w: 'اليوم', n: '30', m: 'أكتوبر' }, { w: 'السبت', n: '31', m: 'أكتوبر' }, { w: 'الأحد', n: '1', m: 'نوفمبر' }, { w: 'الاثنين', n: '2', m: 'نوفمبر' }, { w: 'الثلاثاء', n: '3', m: 'نوفمبر', off: true }, { w: 'الأربعاء', n: '4', m: 'نوفمبر' }];
    var days = DY.map(function (d, i) {
      var on = i === dy;
      return Object.assign({}, d, { on: on, off: !!d.off, pick: function () { self.setState({ dy: i }); },
        style: 'flex:none;width:58px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font-family:inherit;cursor:' + (d.off ? 'not-allowed' : 'pointer') + ';' + (on ? 'background:#2563EB;color:#FFFFFF;border:1px solid #2563EB' : d.off ? 'background:#FAFAFA;color:#9A9A9A;border:1px solid #EBEBEB' : 'background:#FFFFFF;color:#1A1A1A;border:1px solid #E3E3E3') });
    });
    var SL = ['09:00', '09:45', '10:30', '11:15', '14:00', '14:45', '15:30', '16:15'];
    var slots = SL.map(function (t) {
      var on = t === sl;
      return { t: t, on: on, pick: function () { self.setState({ sl: t }); },
        style: 'height:44px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:' + (on ? '700' : '500') + ';font-variant-numeric:tabular-nums;cursor:pointer;' + (on ? 'background:#2563EB;color:#FFFFFF;border:1px solid #2563EB' : 'background:#FFFFFF;color:#1A1A1A;border:1px solid #E3E3E3') };
    });
    var d = DY[dy];
    return { services: services, days: days, slots: slots, summary: SV[sv].n + ' · ' + d.w + ' ' + d.n + ' ' + d.m + ' · ' + sl };
  }
}
</script>
</body>
</html>
