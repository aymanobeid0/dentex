<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القائمة الجانبية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside dir="rtl" style="width:232px;min-height:100vh;box-sizing:border-box;border-left:1px solid #EBEBEB;background:#FFFFFF;padding:20px 14px;display:flex;flex-direction:column;gap:24px;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1A1A1A">
  <a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:#1A1A1A">
    <span style="width:30px;height:30px;border-radius:8px;background:#1A1A1A;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></span>
    <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">[اسم العيادة]</span><span style="font-size:12px;color:#616161">إدارة العيادة</span></span>
  </a>
  <nav aria-label="القائمة الرئيسية" style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="8">
      <a href="{{i.href}}" aria-current="{{i.current}}" style="{{i.style}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"/></svg>
        <span style="flex:1">{{i.label}}</span>
        <sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{i.badgeStyle}}">{{i.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <nav aria-label="الإعدادات" style="margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid #EBEBEB;padding-top:14px">
    <sc-for list="{{bottom}}" as="i" hint-placeholder-count="2">
      <a href="{{i.href}}" aria-current="{{i.current}}" style="{{i.style}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"/></svg>
        <span style="flex:1">{{i.label}}</span>
      </a>
    </sc-for>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 6px 0">
      <span style="width:30px;height:30px;border-radius:50%;background:#F1F1F2;color:#303030;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">د.أ</span>
      <span style="display:flex;flex-direction:column;flex:1"><span style="font-size:13px;font-weight:600">د. أحمد</span><span style="font-size:11px;color:#616161">مدير العيادة</span></span>
      <a href="Login.dc.html" aria-label="تسجيل الخروج" style="width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#4A4A4A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
    </div>
  </nav>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","appts","patients","finance","inventory","lab","inbox","reports","settings","audit"],"default":"home"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active || 'home';
    var IC = {
      home: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      appts: 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM16 2v4M8 2v4M3 10h18',
      patients: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      finance: 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM6 12h.01M18 12h.01',
      inventory: 'M21 8 12 3 3 8v8l9 5 9-5V8ZM3 8l9 5 9-5M12 13v8',
      lab: 'M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3M7 15h10',
      inbox: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z',
      reports: 'm22 7-8.5 8.5-5-5L2 17M16 7h6v6',
      settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
      audit: 'M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4M3 4v7h7'
    };
    var B = {
      warn: 'margin-inline-start:auto;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:#FDEBC0;color:#734600',
      gray: 'margin-inline-start:auto;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:#F1F1F2;color:#3F3F3F',
      blue: 'margin-inline-start:auto;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:#2563EB;color:#FFFFFF'
    };
    function item(id, label, href, badge, bt) {
      var on = id === a;
      return { label: label, href: href, icon: IC[id], current: on ? 'page' : 'false', hasBadge: !!badge, badge: badge || '', badgeStyle: B[bt || 'gray'],
        style: 'display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;text-decoration:none;font-size:13px;' + (on ? 'background:#F1F1F2;color:#1A1A1A;font-weight:600' : 'color:#4A4A4A;font-weight:500') };
    }
    return {
      items: [
        item('home', 'الرئيسية', 'Main.dc.html'),
        item('appts', 'المواعيد', 'Calendar.dc.html', '18'),
        item('patients', 'المرضى', 'Patients.dc.html'),
        item('inbox', 'الرسائل', 'Inbox.dc.html', '3', 'blue'),
        item('finance', 'المالية', 'Finance.dc.html'),
        item('inventory', 'المخزون', 'Inventory.dc.html', '2', 'warn'),
        item('lab', 'طلبات المعمل', 'Lab.dc.html'),
        item('reports', 'التقارير', 'Reports.dc.html')
      ],
      bottom: [item('audit', 'سجل النشاط', 'Audit.dc.html'), item('settings', 'الإعدادات', 'Settings.dc.html')]
    };
  }
}
</script>
</body>
</html>
