<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عارض الأشعة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.btn{transition:filter .15s ease}
.btn:hover{filter:brightness(.95)}
.tool:hover{background:#2A2A2A !important}
.btn:focus-visible,.tool:focus-visible,.th:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.th:hover{border-color:#BDBDBD !important}
</style>
</helmet>
<div dir="rtl" style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FFFFFF">
<div style="flex:0 0 232px;display:flex"><dc-import name="Sidebar" active="patients" hint-size="232px,900px"></dc-import></div>
<div dir="rtl" style="flex:999 1 560px;min-width:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1A1A1A;background:#FFFFFF;min-height:100vh;display:flex;flex-direction:column">

  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #EBEBEB">
    <a href="Patient.dc.html" aria-label="رجوع لملف المريض" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #E3E3E3;border-radius:8px;color:#303030"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
    <div style="display:flex;flex-direction:column"><h1 style="margin:0;font-size:16px;font-weight:600">الأشعة</h1><span style="font-size:12px;color:#616161">مريم أحمد · ملف 1042 · 4 صور</span></div>
    <div style="margin-inline-start:auto;display:flex;gap:8px">
      <button class="btn" type="button" aria-pressed="{{compare}}" onClick="{{toggleCompare}}" style="{{compareBtn}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg>مقارنة قبل وبعد</button>
      <button class="btn" type="button" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #2563EB;border-radius:8px;background:#2563EB;color:#FFFFFF;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>رفع صورة</button>
    </div>
  </header>

  <div style="flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:16px 24px 24px;align-items:stretch">
    <!-- thumbnails -->
    <nav aria-label="الصور" style="flex:0 1 180px;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
        <button class="th" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
          <span aria-hidden="true" style="height:70px;border-radius:6px;background:#1C1C1C;display:flex;align-items:center;justify-content:center;color:#8A8A8A;font-size:10px">{{t.kind}}</span>
          <span style="font-size:12px;font-weight:600;text-align:start">{{t.title}}</span>
          <span style="font-size:11px;color:#616161;text-align:start">{{t.date}}</span>
        </button>
      </sc-for>
    </nav>

    <!-- viewer -->
    <section aria-label="العارض" style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#141414;min-height:600px">
      <div role="toolbar" aria-label="أدوات العرض" style="display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid #262626">
        <button class="tool" type="button" aria-label="تكبير" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:#E5E5E5;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg></button>
        <button class="tool" type="button" aria-label="تصغير" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:#E5E5E5;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/></svg></button>
        <button class="tool" type="button" aria-label="التباين" aria-pressed="true" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:#2A2A2A;color:#FFFFFF;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg></button>
        <button class="tool" type="button" aria-label="قياس" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:#E5E5E5;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0ZM14.5 12.5l2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2"/></svg></button>
        <button class="tool" type="button" aria-label="تدوير" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:#E5E5E5;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
        <button class="tool" type="button" aria-label="ملاحظة على الصورة" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:#E5E5E5;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <span style="margin-inline-start:auto;font-size:12px;color:#B5B5B5;font-variant-numeric:tabular-nums">140%</span>
      </div>

      <sc-if value="{{single}}" hint-placeholder-val="{{true}}">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative">
          <div style="{{frame}}">
            <svg width="70%" viewBox="0 0 200 110" role="img" aria-label="{{cur.title}}"><g fill="none" stroke="#9A9A9A" stroke-width="1.4"><path d="M20 30 Q100 -5 180 30"/><path d="M20 80 Q100 115 180 80"/></g><g fill="#5A5A5A"><rect x="30" y="36" width="9" height="18" rx="3"></rect><rect x="40.4" y="32" width="9" height="18" rx="3"></rect><rect x="50.8" y="28.7" width="9" height="18" rx="3"></rect><rect x="61.2" y="26.1" width="9" height="18" rx="3"></rect><rect x="71.6" y="24.1" width="9" height="18" rx="3"></rect><rect x="82" y="22.7" width="9" height="18" rx="3"></rect><rect x="92.4" y="22.1" width="9" height="18" rx="3"></rect><rect x="102.8" y="22.1" width="9" height="18" rx="3"></rect><rect x="113.2" y="22.7" width="9" height="18" rx="3"></rect><rect x="123.6" y="24.1" width="9" height="18" rx="3"></rect><rect x="134" y="26.1" width="9" height="18" rx="3"></rect><rect x="144.4" y="28.7" width="9" height="18" rx="3"></rect><rect x="154.8" y="32" width="9" height="18" rx="3"></rect><rect x="165.2" y="36" width="9" height="18" rx="3"></rect><rect x="30" y="56" width="9" height="18" rx="3"></rect><rect x="40.4" y="60" width="9" height="18" rx="3"></rect><rect x="50.8" y="63.3" width="9" height="18" rx="3"></rect><rect x="61.2" y="65.9" width="9" height="18" rx="3"></rect><rect x="71.6" y="67.9" width="9" height="18" rx="3"></rect><rect x="82" y="69.3" width="9" height="18" rx="3"></rect><rect x="92.4" y="69.9" width="9" height="18" rx="3"></rect><rect x="102.8" y="69.9" width="9" height="18" rx="3"></rect><rect x="113.2" y="69.3" width="9" height="18" rx="3"></rect><rect x="123.6" y="67.9" width="9" height="18" rx="3"></rect><rect x="134" y="65.9" width="9" height="18" rx="3"></rect><rect x="144.4" y="63.3" width="9" height="18" rx="3"></rect><rect x="154.8" y="60" width="9" height="18" rx="3"></rect><rect x="165.2" y="56" width="9" height="18" rx="3"></rect></g><circle cx="148" cy="82" r="10" fill="none" stroke="#F5A524" stroke-width="1.6" stroke-dasharray="3 2"/></svg>
            <span style="position:absolute;bottom:12px;inset-inline-start:14px;font-size:12px;color:#B5B5B5">{{cur.title}} · {{cur.date}}</span>
            <span style="position:absolute;top:12px;inset-inline-end:14px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;background:rgba(245,165,36,.16);color:#F7C26B;font-size:12px;font-weight:500">ملاحظة: تسوس عميق · 46</span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{compare}}" hint-placeholder-val="{{false}}">
        <div style="flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#262626">
          <div style="background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;position:relative">
            <span style="position:absolute;top:12px;inset-inline-start:14px;height:22px;padding:0 8px;border-radius:6px;background:#2A2A2A;color:#E5E5E5;font-size:12px;font-weight:600;display:inline-flex;align-items:center">قبل · 28 سبتمبر</span>
            <svg width="55%" viewBox="0 0 60 110" role="img" aria-label="أشعة ذروية للسن 36 قبل العلاج"><rect x="15" y="6" width="30" height="40" rx="8" fill="#6A6A6A"/><path d="M20 44 L18 100 M40 44 L42 100" stroke="#6A6A6A" stroke-width="8" stroke-linecap="round"/><circle cx="30" cy="22" r="7" fill="#2A2A2A"/><circle cx="19" cy="102" r="7" fill="none" stroke="#F5A524" stroke-width="1.5" stroke-dasharray="3 2"/></svg>
            <span style="font-size:12px;color:#B5B5B5">التهاب حول الذروة</span>
          </div>
          <div style="background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;position:relative">
            <span style="position:absolute;top:12px;inset-inline-start:14px;height:22px;padding:0 8px;border-radius:6px;background:#2A2A2A;color:#E5E5E5;font-size:12px;font-weight:600;display:inline-flex;align-items:center">بعد · 12 أكتوبر</span>
            <svg width="55%" viewBox="0 0 60 110" role="img" aria-label="أشعة ذروية للسن 36 بعد علاج العصب"><rect x="15" y="6" width="30" height="40" rx="8" fill="#6A6A6A"/><path d="M20 44 L18 100 M40 44 L42 100" stroke="#6A6A6A" stroke-width="8" stroke-linecap="round"/><path d="M20 30 L18 98 M40 30 L42 98" stroke="#EDEDED" stroke-width="2.4" stroke-linecap="round"/><rect x="22" y="14" width="16" height="14" rx="3" fill="#D4D4D4"/></svg>
            <span style="font-size:12px;color:#B5B5B5">حشو القنوات مكتمل</span>
          </div>
        </div>
      </sc-if>
    </section>

    <!-- info -->
    <aside aria-label="تفاصيل الصورة" style="flex:1 1 260px;max-width:300px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <section style="border:1px solid #EBEBEB;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px">
        <h2 style="margin:0;font-size:14px;font-weight:600">{{cur.title}}</h2>
        <div style="display:flex;font-size:13px"><span style="color:#616161">التاريخ</span><span style="margin-inline-start:auto;font-weight:500">{{cur.date}}</span></div>
        <div style="display:flex;font-size:13px"><span style="color:#616161">الأسنان</span><span style="margin-inline-start:auto;font-weight:500">{{cur.teeth}}</span></div>
        <div style="display:flex;font-size:13px"><span style="color:#616161">التقطها</span><span style="margin-inline-start:auto;font-weight:500">{{cur.by}}</span></div>
        <div style="display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid #EBEBEB"><span style="font-size:12px;font-weight:600;color:#616161">ملاحظة الطبيب</span><span style="font-size:13px;line-height:1.7">{{cur.note}}</span></div>
      </section>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn" type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>تنزيل الصورة</button>
        <button class="btn" type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;border:1px solid #E3E3E3;border-radius:8px;background:#FFFFFF;color:#303030;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>إرسال للمريض</button>
      </div>
    </aside>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, s = this.state || {};
    var sel = s.sel || 0, cmp = !!s.cmp;
    var X = [
      { title: 'أشعة ذروية · 46', kind: 'ذروية', date: '12 أكتوبر 2026', teeth: '46، 47', by: 'د. أحمد', note: 'تسوس عميق على السطح الوحشي للسن 46 قريب من اللب، يُنصح بحشوة مع قاعدة واقية.' },
      { title: 'أشعة ذروية · 36', kind: 'ذروية', date: '12 أكتوبر 2026', teeth: '36', by: 'د. أحمد', note: 'حشو القنوات مكتمل وبطول مناسب. التاج في الخطوة التالية.' },
      { title: 'أشعة ذروية · 36', kind: 'ذروية', date: '28 سبتمبر 2026', teeth: '36', by: 'د. أحمد', note: 'آفة حول الذروة، يحتاج علاج عصب.' },
      { title: 'بانورامية', kind: 'بانورامية', date: '14 سبتمبر 2026', teeth: 'كامل الفم', by: 'د. سارة', note: 'غياب 18 و38 و48. ترميمات سابقة على 16 و17 و21 و26.' }
    ];
    var thumbs = X.map(function (x, i) {
      var on = i === sel;
      return Object.assign({}, x, { on: on, pick: function () { self.setState({ sel: i, cmp: false }); },
        style: 'display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;font-family:inherit;color:#1A1A1A;cursor:pointer;background:#FFFFFF;border:1px solid ' + (on ? '#2563EB' : '#E3E3E3') + (on ? ';box-shadow:0 0 0 1px #2563EB' : '') });
    });
    var upper = [], lower = [];
    for (var i = 0; i < 14; i++) {
      var x = 30 + i * 10.4, t = (i - 6.5) / 6.5;
      upper.push({ x: x.toFixed(1), y: (22 + t * t * 14).toFixed(1) });
      lower.push({ x: x.toFixed(1), y: (70 - t * t * 14).toFixed(1) });
    }
    return {
      thumbs: thumbs, cur: X[sel], compare: cmp, single: !cmp, upper: upper, lower: lower,
      toggleCompare: function () { self.setState({ cmp: !cmp }); },
      compareBtn: 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;' + (cmp ? 'border:1px solid #1A1A1A;background:#1A1A1A;color:#FFFFFF' : 'border:1px solid #E3E3E3;background:#FFFFFF;color:#303030'),
      frame: 'position:relative;width:100%;max-width:760px;aspect-ratio:2/1.1;border-radius:8px;background:#1C1C1C;display:flex;align-items:center;justify-content:center'
    };
  }
}
</script>
</body>
</html>
