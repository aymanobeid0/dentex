# Dokploy: select Docker Compose (not Stack), this file, and manual deployment.
services:
  database:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: dentex_staging
      POSTGRES_USER: dentex
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
    volumes:
      - staging_database:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dentex -d dentex_staging"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging:
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://dentex:${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}@database:5432/dentex_staging
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://dentex:${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}@database:5432/dentex_staging
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET}
      APP_ORIGIN: https://dentex.itlabservice.com
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY: ${STAGING_TRUST_PROXY:-}
    expose:
      - '3000'
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: '3'

volumes:
  staging_database:

networks:
  private:
    internal: true
