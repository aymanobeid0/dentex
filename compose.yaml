name: dentex
services:
  database:
    image: postgres:18.6-bookworm
    ports:
      - "127.0.0.1:55460:5432"
    environment:
      POSTGRES_DB: dentex_dev
      POSTGRES_USER: dentex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentex -d dentex_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  database_data:
