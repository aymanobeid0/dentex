name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded commit should not keep consuming a runner.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: dentex_test
          POSTGRES_USER: dentex
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentex -d dentex_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://dentex:ci-only-password@127.0.0.1:5432/dentex_test
      TEST_DATABASE_URL: postgresql://dentex:ci-only-password@127.0.0.1:5432/dentex_test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Initialize isolated test database
        run: npm run db:deploy
      - name: Check architecture and build in parallel
        shell: bash
        run: |
          npm run check:architecture &
          architecture_pid=$!
          npm run check:frontend-architecture &
          frontend_architecture_pid=$!
          npm run build &
          build_pid=$!
          failed=0
          wait "$architecture_pid" || failed=1
          wait "$frontend_architecture_pid" || failed=1
          wait "$build_pid" || failed=1
          exit "$failed"
      - name: Run full suite
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/dentex-tests.json"
      - name: Reject skipped or incomplete tests
        run: node scripts/check-test-report.mjs "$RUNNER_TEMP/dentex-tests.json"
